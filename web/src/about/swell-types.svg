<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 376" role="img" aria-labelledby="swell-types-t swell-types-d" class="how-swell">
<title id="swell-types-t">Wind swell and groundswell</title>
<desc id="swell-types-d">Two side-on wave trains over the same 600 metres of sea, to scale. A 6-second wind swell has crests 56 metres apart and is short and messy; a 14-second groundswell has crests 306 metres apart in long, even lines, and travels more than twice as fast. Below, a side-on seabed out to 36 km: a wave starts to feel the bottom at half its wavelength, so the groundswell starts slowing and bending about 30 km out and the wind swell only a couple of kilometres from the beach.</desc>
