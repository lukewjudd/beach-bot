<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 214" role="img" aria-labelledby="warmth-t warmth-d" class="how-swell">
<title id="warmth-t">Warmth counts where the day is heading</title>
<desc id="warmth-d">Line chart of a day going to 30 degrees with a southerly change at 4pm. At 7am it's 19 degrees, but the score counts 27, three under the warmth still to come. Through the afternoon it counts the warmth, three under the peak, until the change drops it four degrees or more; after that it counts the real temperature.</desc>
<rect x="34.0" y="26" width="117.3" height="154" fill="var(--accent)" opacity=".1"/>
<text x="92.7" y="18" text-anchor="middle" class="hs-small">morning session</text>
<rect x="292.1" y="26" width="93.9" height="154" fill="var(--accent)" opacity=".1"/>
<text x="339.1" y="18" text-anchor="middle" class="hs-small">evening session</text>
<line x1="34" y1="180.0" x2="386" y2="180.0" stroke="var(--line)"/>
<text x="29" y="184.0" text-anchor="end" class="hs-small">16°</text>
<line x1="34" y1="141.5" x2="386" y2="141.5" stroke="var(--line)"/>
<text x="29" y="145.5" text-anchor="end" class="hs-small">20°</text>
<line x1="34" y1="103.0" x2="386" y2="103.0" stroke="var(--line)"/>
<text x="29" y="107.0" text-anchor="end" class="hs-small">24°</text>
<line x1="34" y1="64.5" x2="386" y2="64.5" stroke="var(--line)"/>
<text x="29" y="68.5" text-anchor="end" class="hs-small">28°</text>
<line x1="34" y1="26.0" x2="386" y2="26.0" stroke="var(--line)"/>
<text x="29" y="30.0" text-anchor="end" class="hs-small">32°</text>
<text x="57.5" y="196" text-anchor="middle" class="hs-small">6am</text>
<text x="127.9" y="196" text-anchor="middle" class="hs-small">9am</text>
<text x="198.3" y="196" text-anchor="middle" class="hs-small">noon</text>
<text x="268.7" y="196" text-anchor="middle" class="hs-small">3pm</text>
<text x="339.1" y="196" text-anchor="middle" class="hs-small">6pm</text>
<path d="M34.0,160.8L57.5,160.8L80.9,151.1L104.4,131.9L127.9,112.6L151.3,93.4L174.8,74.1L198.3,64.5L221.7,45.2L245.2,45.2L268.7,54.9L292.1,103.0L315.6,122.2L339.1,131.9L362.5,141.5L386.0,151.1" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 3"/>
<path d="M34.0,74.1L57.5,74.1L80.9,74.1L104.4,74.1L127.9,74.1L151.3,74.1L174.8,74.1L198.3,64.5L221.7,45.2L245.2,45.2L268.7,54.9L292.1,103.0L315.6,122.2L339.1,131.9L362.5,141.5L386.0,151.1" fill="none" stroke="var(--r-amber)" stroke-width="2.5"/>
<circle cx="80.9" cy="74.1" r="3.5" fill="var(--r-amber)"/>
<text x="74.9" y="65.1" class="hs-label">7am counts as 27°</text>
<text x="82.9" y="167.1" class="hs-small">it’s 19°</text>
<text x="309.6" y="144.2" text-anchor="end" class="hs-small">southerly: counts as it is</text>
<path d="M34,204h16" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 3"/>
<text x="54" y="208" class="hs-small">temperature</text>
<path d="M144,204h16" stroke="var(--r-amber)" stroke-width="2.5"/>
<text x="164" y="208" class="hs-small">warmth the score counts</text>
</svg>
