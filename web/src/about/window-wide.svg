<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 589" role="img" aria-labelledby="window-wide-t window-wide-d" class="how-swell">
<title id="window-wide-t">North Bondi's swell window, zoomed out</title>
<desc id="window-wide-d">The same lines from North Bondi on a map running south to Maroubra. The lines just west of south cross Bondi's bay and stop on the coast between Bronte and Maroubra, so swell from there runs along the coast rather than in from the open ocean. The dashed box is the close-up.</desc>
