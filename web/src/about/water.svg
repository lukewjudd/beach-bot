<title id="water-t">How much rain each beach can take</title>
<desc id="water-d">Bar chart of rain in the last 24 hours against each eastern beach: green where it's fine, amber where it loses points, red where it's ruled out. Enclosed and lightly flushed beaches like Tamarama and Malabar are ruled out after 5mm; Bondi, Clovelly and Maroubra take 20mm.</desc>
