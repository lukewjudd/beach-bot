<title id="window-t">Finding North Bondi's swell window</title>
<desc id="window-d">Lines drawn from just off North Bondi every 4 degrees. Solid lines reach 30 km of open ocean, between 152 and 188 degrees. Dashed lines stop at land with a dot, most of them on Ben Buckler, the headland to the north-east; a few to the south-south-west cross the bay and hit the coast further south.</desc>
