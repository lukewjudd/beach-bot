<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" role="img" aria-labelledby="pools-t pools-d" class="how-swell">
<title id="pools-t">Ocean pools and the tide</title>
<desc id="pools-d">A day's tide curve. Around high tide, two and a half hours either side, a big swell washes over the pool walls. Around low tide is when the low-tide pools, Wylie's Baths and McIver's, are at their best.</desc>
