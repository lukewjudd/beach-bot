<title id="sessions-t">Three sessions a day</title>
<desc id="sessions-d">A 24-hour clock with noon at the top. Every day is cut into three sessions: morning from sunrise to 11am, midday from 11am to 2pm, and evening from 2pm to sunset. The night, from sunset to sunrise, isn't scored.</desc>
