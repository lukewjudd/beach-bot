<title id="bluebottles-t">Winds that bring bluebottles</title>
<desc id="bluebottles-d">Maroubra with lines for every wind direction. North-easterlies and southerlies are highlighted: a day of either at 20 km/h or more, from November to March, can blow bluebottles onto the eastern beaches, Maroubra most of all.</desc>
