<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 194" role="img" aria-labelledby="sky-t sky-d" class="how-swell">
<title id="sky-t">What the weather does to a score</title>
<desc id="sky-d">Bar chart of points out of 100. Storms rule a session out. Rain falling or a 60% chance costs 20, a 40 to 60% chance costs 8, heavy cloud costs 5. Air of 26 degrees or more adds 15 and under 17 takes 15. Water over 22 degrees adds 5; water under 20 is only noted.</desc>
<line x1="267.0" y1="6" x2="267.0" y2="190" stroke="var(--line)" stroke-width="1.5"/>
<text x="150" y="22" text-anchor="end" class="hs-small">Storms about</text>
<rect x="158" y="12" width="218" height="14" rx="3" fill="var(--r-red)" opacity=".18"/>
<text x="267.0" y="23" text-anchor="middle" class="hs-label" fill="var(--r-red)">ruled out</text>
<text x="150" y="44" text-anchor="end" class="hs-small">Raining, or 60%+ chance</text>
<rect x="198.9" y="35" width="68.1" height="12" rx="2" fill="var(--r-red)" opacity=".8"/>
<text x="193.9" y="45" text-anchor="end" class="hs-label">-20</text>
<text x="150" y="66" text-anchor="end" class="hs-small">40–60% chance of rain</text>
<rect x="239.8" y="57" width="27.2" height="12" rx="2" fill="var(--r-red)" opacity=".8"/>
<text x="234.8" y="67" text-anchor="end" class="hs-label">-8</text>
<text x="150" y="88" text-anchor="end" class="hs-small">Heavy cloud (85%+)</text>
<rect x="250.0" y="79" width="17.0" height="12" rx="2" fill="var(--r-red)" opacity=".8"/>
<text x="245.0" y="89" text-anchor="end" class="hs-label">-5</text>
<text x="150" y="110" text-anchor="end" class="hs-small">Air 26° or warmer</text>
<rect x="267.0" y="101" width="51.1" height="12" rx="2" fill="var(--r-green)" opacity=".8"/>
<text x="323.1" y="111" text-anchor="start" class="hs-label">+15</text>
<text x="150" y="132" text-anchor="end" class="hs-small">Air under 17°</text>
<rect x="215.9" y="123" width="51.1" height="12" rx="2" fill="var(--r-red)" opacity=".8"/>
<text x="210.9" y="133" text-anchor="end" class="hs-label">-15</text>
<text x="150" y="154" text-anchor="end" class="hs-small">Water over 22°</text>
<rect x="267.0" y="145" width="17.0" height="12" rx="2" fill="var(--r-green)" opacity=".8"/>
<text x="289.0" y="155" text-anchor="start" class="hs-label">+5</text>
<text x="150" y="176" text-anchor="end" class="hs-small">Water under 20°</text>
<text x="273.0" y="177" class="hs-small">noted, no penalty</text>
</svg>
