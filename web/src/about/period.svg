<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-labelledby="period-t period-d" class="how-swell">
<title id="period-t">Longer swell breaks bigger</title>
<desc id="period-d">Line chart of how big a 1.5 metre swell breaks, by its period from 6 to 16 seconds. At a swimming beach it grows gently, from 1.3m at 6 seconds to 1.9m at 16. At a surf break it grows faster, and short swell is weaker there.</desc>
<line x1="44" y1="157.7" x2="384" y2="157.7" stroke="var(--line)"/>
<text x="38" y="161.7" text-anchor="end" class="hs-small">1m</text>
<line x1="44" y1="101.0" x2="384" y2="101.0" stroke="var(--line)"/>
<text x="38" y="105.0" text-anchor="end" class="hs-small">1.5m</text>
<line x1="44" y1="44.3" x2="384" y2="44.3" stroke="var(--line)"/>
<text x="38" y="48.3" text-anchor="end" class="hs-small">2m</text>
<text x="44.0" y="202" text-anchor="middle" class="hs-small">6 s</text>
<text x="112.0" y="202" text-anchor="middle" class="hs-small">8 s</text>
<text x="180.0" y="202" text-anchor="middle" class="hs-small">10 s</text>
<text x="248.0" y="202" text-anchor="middle" class="hs-small">12 s</text>
<text x="316.0" y="202" text-anchor="middle" class="hs-small">14 s</text>
<text x="384.0" y="202" text-anchor="middle" class="hs-small">16 s</text>
<text x="384" y="216" text-anchor="end" class="hs-small">swell period</text>
