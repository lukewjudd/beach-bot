<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="wrap-t wrap-d" class="how-swell">
<title id="wrap-t">Long swell wraps further into Collaroy</title>
<desc id="wrap-d">Line chart of how much of a swell reaches Collaroy from each direction, north round to south. Both lines fade out at the edges of the open ocean rather than stopping dead. From the south-south-east, round Long Reef, about 59% of an 8 second swell gets in and 75% of a 14 second one.</desc>
<rect x="86.1" y="22" width="174.6" height="172" fill="var(--accent)" opacity=".1"/>
<text x="173.5" y="14" text-anchor="middle" class="hs-small">open ocean from Collaroy</text>
<line x1="40" y1="194.0" x2="386" y2="194.0" stroke="var(--line)"/>
<text x="34" y="198.0" text-anchor="end" class="hs-small">0%</text>
<line x1="40" y1="151.0" x2="386" y2="151.0" stroke="var(--line)"/>
<text x="34" y="155.0" text-anchor="end" class="hs-small">25%</text>
<line x1="40" y1="108.0" x2="386" y2="108.0" stroke="var(--line)"/>
<text x="34" y="112.0" text-anchor="end" class="hs-small">50%</text>
<line x1="40" y1="65.0" x2="386" y2="65.0" stroke="var(--line)"/>
<text x="34" y="69.0" text-anchor="end" class="hs-small">75%</text>
<line x1="40" y1="22.0" x2="386" y2="22.0" stroke="var(--line)"/>
<text x="34" y="26.0" text-anchor="end" class="hs-small">100%</text>
<text x="40.0" y="210" text-anchor="middle" class="hs-small">N</text>
<text x="114.1" y="210" text-anchor="middle" class="hs-small">NE</text>
<text x="188.3" y="210" text-anchor="middle" class="hs-small">E</text>
<text x="262.4" y="210" text-anchor="middle" class="hs-small">SE</text>
<text x="336.6" y="210" text-anchor="middle" class="hs-small">S</text>
