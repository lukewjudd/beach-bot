<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 286" role="img" aria-labelledby="wind-t wind-d" class="how-swell">
<title id="wind-t">Which winds are offshore at Coogee</title>
<desc id="wind-d">Arrows blow in to Coogee from every direction. Coogee faces 100 degrees, a little south of east, so winds from the south-west round to the north-west, off the land, are offshore (green); winds from the north-east round to the south-east, off the sea, are onshore (red, dashed); the rest are cross-shore (amber).</desc>
