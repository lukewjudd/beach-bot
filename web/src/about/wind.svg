<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 286" role="img" aria-labelledby="wind-t wind-d" class="how-swell">
<title id="wind-t">Which winds are offshore at Coogee</title>
<desc id="wind-d">Coogee faces 100 degrees, a little south of east. A compass shows winds from the south-west round to the north-west are offshore, blowing from the land out over the water; winds from the north-east round to the south-east are onshore; the rest are cross-shore.</desc>
