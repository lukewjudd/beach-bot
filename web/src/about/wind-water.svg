<title id="wind-water-t">What offshore and onshore wind do to the water</title>
<desc id="wind-water-d">Two side-on drawings of the same beach and swell. With an offshore wind blowing from the land out to sea, the water is smooth and clear. With an onshore wind blowing in from the sea, the surface is broken up by chop and whitecaps.</desc>
