<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 332" role="img" aria-labelledby="hs-t hs-d" class="how-swell">
<title id="hs-t">How swell and wind reach North Bondi</title>
<desc id="hs-d">Map of Bondi Beach. Ben Buckler, the headland at the north end, blocks swell from the north-east and east, so only swell from 152 to 188 degrees (south-south-east round to south) has an open run to the north end. Arrows show the share of a 10 second swell that reaches it from each direction. A compass shows north-west winds blow offshore and south-east winds onshore.</desc>
