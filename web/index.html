<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beach Calls</title>
  <meta name="description" content="Best beach sessions in Sydney's eastern suburbs, scored three times a day.">
  <!-- Start fetching the scores alongside the JS rather than after it -->
  <link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
  <link rel="preload" href="%VITE_SCORES_URL%" as="fetch" crossorigin>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
</head>
<body>
  <header class="top">
    <h1>Beach calls</h1>
    <p class="sub" id="updated">Eastern suburbs, Sydney</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sessions"></nav>

  <main>
    <section class="hero" id="hero" aria-live="polite">
      <div class="loading"><span class="spinner" aria-hidden="true"></span> Checking the forecast…</div>
    </section>
    <div class="layout">
      <div id="map" role="region" aria-label="Map of beach scores"></div>
      <section class="panel">
        <!-- Pinned while the spots list scrolls, so picking a spot visibly changes the conditions -->
        <div class="pinned">
          <div class="filters" id="filters" role="group" aria-label="Show"></div>
          <h2 id="conditions-title">Conditions</h2>
          <div class="report" id="report"></div>
        </div>
        <h2>Spots</h2>
        <ol class="spots" id="spots"></ol>
      </section>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
