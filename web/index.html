<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beach Calls</title>
  <meta name="description" content="Best beach sessions in Sydney's eastern suburbs, scored every hour.">
  <!-- Start fetching the scores alongside the JS rather than after it -->
  <link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
  <link rel="preload" href="%VITE_SCORES_URL%" as="fetch" crossorigin>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
</head>
<body>
  <header class="top">
    <h1>Beach calls</h1>
    <p class="sub" id="updated">Eastern suburbs, Sydney</p>
  </header>
  <p class="stale-banner" id="stale" hidden></p>

  <nav class="week" aria-label="Days">
    <div class="week-pick" id="week-pick" role="group" aria-label="Week"></div>
    <div class="days" id="days"></div>
  </nav>

  <main>
    <section class="hero" id="hero" aria-live="polite">
      <div class="loading"><span class="spinner" aria-hidden="true"></span> Checking the forecast…</div>
    </section>
    <div class="view-toggle" id="view-toggle" role="group" aria-label="View">
      <button type="button" data-view="list" aria-pressed="true">List</button>
      <button type="button" data-view="map" aria-pressed="false">Map</button>
    </div>
    <div class="layout" id="layout" data-view="list">
      <div id="map" role="region" aria-label="Map of spot scores"></div>
      <section class="panel" aria-label="Spots">
        <div class="controls">
          <label>Activity
            <select id="activity">
              <option value="all">All</option>
              <option value="swim">Swim</option>
              <option value="snorkel">Snorkel</option>
              <option value="pool">Pool</option>
              <option value="surf">Surf</option>
            </select>
          </label>
          <label>Sort
            <select id="sort">
              <option value="best">Best first</option>
              <option value="north">North to south</option>
              <option value="area">By place</option>
            </select>
          </label>
        </div>
        <ol class="spots" id="spots"></ol>
      </section>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
